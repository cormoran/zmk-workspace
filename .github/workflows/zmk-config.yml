name: Test ZMK templates

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - ".agents/skills/**"
      - "tools/**"
      - ".devcontainer/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".agents/skills/**"
      - "tools/**"
      - ".devcontainer/**"
      - "**/*.md"
  schedule:
    # 20:00 JST every Friday (11:00 UTC)
    - cron: "0 11 * * 5"

jobs:
  build:
    runs-on: ubuntu-latest
    name: ${{ matrix.project }} / ${{ matrix.branch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: zmk-config-template
            branch: main
            manifest: config/west-workspace.yml
            manifest_dir: config
          - project: zmk-config-template
            branch: v0.3-branch
            manifest: config/west-workspace.yml
            manifest_dir: config
          - project: zmk-module-template
            branch: main
            manifest: west/west-test-workspace.yml
            manifest_dir: west
          - project: zmk-module-template
            branch: v0.3-branch
            manifest: west/west-test-workspace.yml
            manifest_dir: west
    steps:
      - uses: actions/checkout@v4
      - uses: nixbuild/nix-quick-install-action@v34
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 0
      - name: Build nix env
        run: nix develop ./nix
      - name: Clone source into projects
        run: |
          mkdir -p projects
          git clone --branch '${{ matrix.branch }}' --single-branch \
            'https://github.com/cormoran/${{ matrix.project }}.git' \
            'projects/${{ matrix.project }}'
      - name: Prepare CI West workspace
        id: profile
        run: |
          profile="$GITHUB_WORKSPACE/ws/ci-${{ matrix.project }}-${{ matrix.branch }}"
          mkdir -p "$profile/workspace-config" "$profile/.west"
          cp -R 'projects/${{ matrix.project }}/${{ matrix.manifest_dir }}' \
            "$profile/workspace-config/"
          cp 'projects/${{ matrix.project }}/${{ matrix.manifest }}' \
            "$profile/workspace-config/west.yml"
          printf '[manifest]\npath = workspace-config\nfile = west.yml\n\n[zephyr]\nbase = zephyr\n' \
            > "$profile/.west/config"
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
      - name: Cache West dependencies
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ${{ steps.profile.outputs.profile }}/zmk
            ${{ steps.profile.outputs.profile }}/zmk-west-commands
            ${{ steps.profile.outputs.profile }}/zephyr
            ${{ steps.profile.outputs.profile }}/modules
            ${{ steps.profile.outputs.profile }}/optional
          key: west-${{ runner.os }}-${{ matrix.project }}-${{ matrix.branch }}-${{ hashFiles('projects/**/config/west*.yml', 'projects/**/west/west*.yml', 'projects/**/west/west-dependency/*.yml') }}
      - name: Update shared dependencies
        run: |
          cd '${{ steps.profile.outputs.profile }}'
          west update --narrow
          west zephyr-export
        shell: nix develop ./nix --command bash -e {0}
      - name: Create source worktree
        id: worktree
        run: |
          profile='${{ steps.profile.outputs.profile }}'
          worktree="$profile/wt-${{ matrix.project }}/${{ matrix.branch }}"
          mkdir -p "$(dirname "$worktree")"
          git -C 'projects/${{ matrix.project }}' worktree add --detach \
            "$worktree" 'origin/${{ matrix.branch }}'
          test "$(cd "$worktree" && west topdir)" = "$profile"
          echo "path=$worktree" >> "$GITHUB_OUTPUT"
        shell: nix develop ./nix --command bash -e {0}
      - name: Build zmk-config
        if: matrix.project == 'zmk-config-template'
        run: |
          cd '${{ steps.worktree.outputs.path }}'
          west zmk-build . -d ./build -q
        shell: nix develop ./nix --command bash -e {0}
      - name: Test zmk-module
        if: matrix.project == 'zmk-module-template'
        run: |
          cd '${{ steps.worktree.outputs.path }}'
          python3 -m unittest
        shell: nix develop ./nix --command bash -e {0}

  # Avoid deactivating scheduled runs by keeping the workflow active.
  keepalive:
    if: github.event_name == 'schedule'
    permissions:
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Re-enable workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_REPO: ${{ github.repository }}
        run: gh workflow enable zmk-config.yml
